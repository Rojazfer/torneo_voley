databases:
  - name: torneo-voley-db
    plan: free

services:
  - type: web
    name: torneo-voley-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: torneo-voley-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://torneo-voley-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://torneo-voley-frontend.onrender.com"
      - key: WEB_CONCURRENCY
        value: "4"

  - type: web
    name: torneo-voley-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://torneo-voley-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
