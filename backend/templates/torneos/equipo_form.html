{% extends 'base.html' %}

{% block title %}{{ titulo }} | AYACUCHO{% endblock %}

{% block content %}
<div class="card p-4">
    <h2 class="mb-4">{{ titulo }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            {% for field in form %}
            <div class="col-md-6">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'equipos_list' %}" class="btn btn-outline-light">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
