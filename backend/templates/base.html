<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AYACUCHO - Sistema de Torneos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --rojo: #d81a1a;
            --rojo-oscuro: #8b0d0d;
            --negro: #0b0b0b;
            --gris: #1e1e1e;
            --blanco: #f5f5f5;
            --amarillo: #ffcc00;
        }

        body {
            background: linear-gradient(135deg, #111111 0%, #1d1d1d 50%, #0b0b0b 100%);
            color: var(--blanco);
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(90deg, var(--rojo) 0%, #8d0d0d 100%);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.8);
            object-fit: cover;
            background: #111;
        }

        .sidebar {
            background: rgba(17,17,17,0.85);
            border-right: 1px solid rgba(255,255,255,0.08);
            min-height: calc(100vh - 72px);
            padding: 1.25rem 1rem;
        }

        .nav-link {
            color: var(--blanco);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.4rem;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(216, 26, 26, 0.2);
            color: #fff;
        }

        .card {
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(26,26,26,0.95);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            color: var(--blanco);
        }

        .stats-box {
            background: linear-gradient(135deg, rgba(216,26,26,0.18), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 1.4rem;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--rojo), var(--rojo-oscuro));
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, var(--rojo-oscuro), var(--rojo));
        }

        .table {
            color: var(--blanco);
        }

        .table thead th {
            color: #ffdb6e;
            border-color: rgba(255,255,255,0.08);
        }

        .table td, .table th {
            border-color: rgba(255,255,255,0.08);
        }

        .form-control, .form-select {
            background: #111;
            color: var(--blanco);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .hero-logo {
            width: 100%;
            max-width: 420px;
            display: block;
            margin: 0 auto 1.5rem;
            filter: drop-shadow(0 10px 25px rgba(216,26,26,0.45));
        }

        .badge-club {
            background: linear-gradient(90deg, var(--rojo), var(--rojo-oscuro));
            color: #fff;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .small-muted {
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand brand-badge" href="{% url 'dashboard' %}">
                <img class="brand-logo" src="https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=200&q=80" alt="AYACUCHO">
                AYACUCHO
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="badge badge-club px-3 py-2">CLUB DE VOLEIBOL</span>
                {% if user.is_authenticated %}
                    <span class="small text-white-50">{{ user.username }}</span>
                {% endif %}
            </div>
        </div>
    </nav>

    {% if user.is_authenticated %}
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 sidebar">
                <div class="d-flex flex-column gap-2">
                    <a class="nav-link active" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'torneos_list' %}">Torneos</a>
                    <a class="nav-link" href="{% url 'equipos_list' %}">Equipos</a>
                    <a class="nav-link" href="{% url 'jugadores_list' %}">Jugadores</a>
                    <a class="nav-link" href="{% url 'credenciales_list' %}">Credenciales</a>
                    <a class="nav-link" href="{% url 'buscar' %}">Buscar</a>
                    <a class="nav-link" href="/admin/">Administración</a>
                </div>
            </aside>
            <main class="col-md-9 p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    {% else %}
        <main class="container py-5">
            {% block content %}{% endblock %}
        </main>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
